<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Shardlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07060d; --fg:#e8e4ff; --muted:#8a84b0; --btn:#1c1830; --btn-hi:#2e2850; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#07060d; --fg:#e8e4ff; --muted:#8a84b0; }
  }
  :root[data-theme="dark"] { --bg:#07060d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"Press Start 2P", ui-monospace, monospace; -webkit-user-select:none; user-select:none;
    touch-action:none; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:0 16px; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#000;
    box-shadow:0 0 0 2px #1c1830, 0 0 40px #4b3fd133; }
  #pad { display:none; width:100%; max-width:420px; justify-content:space-between; align-items:center; }
  .touch #pad { display:flex; }
  .dpad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px); gap:2px; }
  .dpad button:nth-child(1){grid-area:1/2} .dpad button:nth-child(2){grid-area:2/1}
  .dpad button:nth-child(3){grid-area:2/3} .dpad button:nth-child(4){grid-area:3/2}
  .ab { display:flex; gap:12px; align-items:center; }
  #pad button { background:var(--btn); color:var(--fg); border:2px solid var(--btn-hi); border-radius:6px;
    font:inherit; font-size:10px; width:48px; height:48px; padding:0; }
  .ab button { border-radius:50% !important; width:58px !important; height:58px !important; }
  #pad button.on { background:var(--btn-hi); }
  #hint { color:var(--muted); font-size:8px; text-align:center; line-height:1.8; }
  .touch #hint { display:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="256" height="224" aria-label="Shardlight game screen"></canvas>
  <div id="hint">ARROWS/WASD MOVE · Z/SPACE SPARK · X/SHIFT DASH · ENTER PAUSE · M MUTE</div>
  <div id="pad">
    <div class="dpad">
      <button data-k="up">▲</button><button data-k="left">◀</button>
      <button data-k="right">▶</button><button data-k="down">▼</button>
    </div>
    <button data-k="start" style="width:64px">START</button>
    <div class="ab"><button data-k="dash">DASH</button><button data-k="spark">SPARK</button></div>
  </div>
</div>
<script>
"use strict";
/* ==========================================================================
   SHARDLIGHT: THE BOTTLED ISLES
   Designed by Brainiac v1 from its game-design curriculum.
   A collector intelligence sealed the isle of Lumen inside a glass bottle
   and snuffed its Beacon. Mote, the last lantern-keeper, must gather five
   Star Shards, wake the Beacon, and crack the glass.
   ========================================================================== */

const TS = 16, COLS = 16, ROWS = 12, HUD = 32, W = 256, H = 224, PW = COLS * TS, PH = ROWS * TS;
const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
ctx.imageSmoothingEnabled = false;
const FONT = '8px "Press Start 2P", ui-monospace, monospace';

/* ---------------------------------------------------------------- regions */
const REGIONS = {

  cave:   { floor:"#2a2340", speck:"#382e58", accent:"#7a68b8", wallD:"#120e1e", wallM:"#3f3268", wallL:"#7a68b8",
            water:["#1b2b6a","#3355aa","#8fb0ff"], border:"#", slime:["#c27cff","#6a3aa8"] },
  frost:  { floor:"#c3d4e6", speck:"#a6bbd2", accent:"#ffffff", wallD:"#1d4757", wallM:"#3f8299", wallL:"#e6f6ff",
            water:["#3a78c0","#7cc0f0","#e0f6ff"], border:"T", slime:["#8fe0ff","#3a8fb8"] },
  clock:  { floor:"#3a2a1f", speck:"#4a3626", accent:"#d8a050", wallD:"#1e130b", wallM:"#7a4d24", wallL:"#d8a050",
            water:["#3a2a1f","#5a4030","#d8a050"], border:"#", slime:["#ffb347","#a8602a"] },
  core:   { floor:"#0f1626", speck:"#1b2944", accent:"#5f8fd0", wallD:"#070b14", wallM:"#26406a", wallL:"#5f8fd0",
            water:["#0a1430","#1c3a7a","#6fa8ff"], border:"#", slime:["#ff6fa8","#a83a6a"] },
};
const HAZARD = ["#ff3fa4", "#ffd0ea", "#8a1f5c"]; // magenta always means harm
const CRYSTAL = ["#5fd7ff", "#d6f7ff", "#1d6f9a"]; // cyan always means breakable

/* ------------------------------------------------------------------ world
   Each room: 14x10 interior (the border and its exits are generated).
   Exits: W/E at rows 5-6, N/S at cols 7-8.
   . floor  , decor  # rock  T tree/pillar  ~ water (dash skims it)
   ^ spikes = ice  c cracked crystal (spark breaks it)  B beacon
   k key  * star shard  h heart  P start   s slime  b bat  t turret  G guardian */
const WORLD = {
  "1,2": { name:"START GLADE", region:"meadow", exits:"NEW", hint:"Z/SPACE: SPARK BREAKS CRYSTAL", rows:[
    "TT,......,..TT",
    "T....,.......T",
    "..,.TT..TT.,..",
    ".....T..T.....",
    ".,..........,.",
    "......P.......",
    ".,.....,...,..",
    "..TT.....ccc..",
    "..T,.....chc..",
    "TT.......ccc.T"]},
  "0,2": { name:"WHISPER MEADOW", region:"meadow", exits:"NE", rows:[
    "TTTTTT..TTTTTT",
    "T,....,....,.T",
    "T..s.....TT..T",
    "T.TT.....T*T.T",
    "T........TcT..",
    "T.....s.......",
    "T..~~~~......T",
    "T..~~~~..s...T",
    "T,.......,...T",
    "TTTTTTTTTTTTTT"]},
  "2,2": { name:"BROOKSIDE", region:"meadow", exits:"WE", hint:"X/SHIFT: DASH SKIMS WATER", rows:[

    "T.....s..~...T",
    "T..TT....~...T",
    "T........~.,.T",
    ".........~....",
    "..,......~....",
    "T....TT..~..hT",
    "T.s......~...T",
    "T..,.....~.,.T",
    "TTTTTT...~TTTT"]},
  "3,2": { name:"GLASS SHORE", region:"meadow", exits:"WN", rows:[
    "TTTTTT..TTTTTT",
    "T.....,..,...T",
    "T..b.........T",
    "T.....~~~~~~~T",
    "......~~~~~~~T",
    "......~~*.~~~T",
    "T.....~~~~~~~T",
    "T...s...~~~~~T",
    "T,..........,T",
    "TTTTTTTTTTTTTT"]},
  "0,1": { name:"PRISM CAVE", region:"cave", exits:"SE", rows:[
    "##############",
    "#*.c..#...t..#",
    "#..c..#......#",
    "#ccc...b.##..#",
    "#.....b.......",
    "#.............",

    "######..######"]},

    "#####..#######",
    "#............#",
    "#.##......##.#",
    "#.#...s....#.#",
    "..............",
    "..............",
    "#.#........#.#",
    "#.##..b...##.#",
    "#............#",
    "######..######"]},
  "2,1": { name:"BAT ROOST", region:"cave", exits:"WE", hint:"DASHING IS SAFE OVER SPIKES", rows:[
    "##############",
    "#..b......b..#",
    "#....^^^^....#",
    "#.b..^*.^..b.#",
    ".....^^^^.....",

  "3,1": { name:"SUNKEN HALL", region:"cave", exits:"WS", rows:[

    "T*.=====^....T",

    "T..=====^....T",
    "T..=====......",
    "T..=====......",
    "T.^=====^^...T",
    "T..=====.b...T",
    "T..........h.T",
    "TTTTTTTTTTTTTT"]},
  "2,0": { name:"CLOCKWORK GATE", region:"clock", exits:"WE", locks:{E:"seal"}, hint:"THE SEAL WAKES FOR 5 SHARDS", rows:[
    "##############",
    "#t...^...^..t#",
    "#..#.^.#.^.#.#",
    "#..#...#...#.#",
    "...#.^.#.^.#..",
    ".....^...^....",
    "#.##.^.#.^.#.#",

    "##############"]},

    "##############",
    "#............#",
    "#..T..B...T..#",

    "..............",
    "......G.......",
    "#............#",
    "#..T......T..#",
    "#............#",
    "##############"]},
};
const START_ROOM = "1,2", TOTAL_SHARDS = 5;

/* ---------------------------------------------------------------- utils */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mk(w, h, paint) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); paint(g); return c; }
const px = (g, x, y, col, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };

/* -------------------------------------------------------------- sprites */
function sprite(rows, pal) {
  return mk(16, 16, g => rows.forEach((row, y) => [...row.padEnd(16, ".")].slice(0, 16).forEach((ch, x) => {
    if (ch !== "." && pal[ch]) px(g, x, y, pal[ch]);
  })));
}
const HERO_PAL = { K:"#1a1020", H:"#e8743b", h:"#a8452a", F:"#ffd8a8", E:"#1a1020", L:"#ffe066", l:"#fff6b0", B:"#3a5ca8", b:"#24407a" };
const LEGS = [[".....KbbbbK.....", ".....KbK.KbK....", ".....KK...KK...."],
              [".....KbbbbK.....", "....KbK...KbK...", "....KK.....KK..."]];
const HERO = {
  down: ["................", ".....KKKKKK.....", "....KHHHHHHK....", "...KHHHHHHhHK...", "...KHHFFFFhHK...",
         "...KHFEFFEFhK...", "...KHFFFFFFhK...", "....KHFFFFhK....", "...KKBBBBBBKK...", "..KlLKBBBBbbK...",
         "..KLLKBBBbbbK...", "...KK.KBBbbK...."],
  up:   ["................", ".....KKKKKK.....", "....KHHHHHHK....", "...KHHHHHHhHK...", "...KHHHHHHhHK...",
         "...KHHHHHHhHK...", "...KhHHHHHhhK...", "....KhhhhhhK....", "...KKBBBBBBKK...", "...KBBBBBBbbK...",
         "...KBBBBBbbbK...", "....KBBBBbbK...."],
  side: ["................", ".....KKKKK......", "....KHHHHHKK....", "...KHHHHHHHHK...", "...KhHHHFFFFK...",
         "...KhHHFFFEFK...", "...KhHHFFFFFK...", "....KhHFFFFK....", "....KKBBBBKK....", "....KBBBBKlLK...",
         "....KBBBBKLLK...", "....KbBBBBKK...."],
};
const heroSprites = {};
for (const d of ["down", "up", "side"]) heroSprites[d] = LEGS.map(l => sprite(HERO[d].concat(l, ["................"]), HERO_PAL));
const heroFlash = LEGS.map(l => sprite(HERO.down.concat(l), Object.fromEntries(Object.keys(HERO_PAL).map(k => [k, "#ffffff"]))));

function slimeSprites(pal) {
  const p = { K:"#140c18", g:pal[0], d:pal[1], w:"#ffffff" };
  return [
    ["", "", "", "", "", "......KKKK......", "....KKggggKK....", "...KggggggwgK...", "..KggggggggwgK..", "..KgKKggggKKgK..",
     "..KgKwggggKwgK..", ".KggggggggggggK.", ".KdggggggggggdK.", ".KddggggggggddK.", "..KKdddddddddKK.", "....KKKKKKKKK..."],
    ["", "", "", "", "", "", "", ".....KKKKKK.....", "...KKggggggKK...", "..KgggggggggwK..", ".KggKKggggKKgwK.",
     ".KggKwggggKwggK.", "KgggggggggggggdK", "KddggggggggggddK", ".KKdddddddddddK.", "..KKKKKKKKKKKK.."],
  ].map(r => sprite(r.map(s => s || "................"), p));
}
const BAT_PAL = { K:"#140c18", w:"#6a3aa8", W:"#a46ae8", e:"#ff3fa4", f:"#ffd0ea" };
const batSprites = [
  ["", "", "", "K............K", "KK...........KK", "KWK..KKKKK..KWK", "KWWKKwwwwwKKWWK.", ".KWWwwewewwwWWK.",
   ".KWWwwwwwwwWWK..", "..KKKwfwfwKKK...", ".....KwwwK......", "......KKK......."],
  ["", "", "", "", "", ".....KKKKK......", "...KKwwwwwKK....", "..KWwwewewwWK...", ".KWWwwwwwwwWWK..",
   "KWWKKwfwfwKKWWK.", "KWK..KwwwK..KWK.", "KK....KKK....KK.", "K.............K."],
].map(r => sprite(r.map(s => s || "................"), BAT_PAL));
const turretSprite = sprite(["", "", "....KKKKKKKK....", "...KccccccccK...", "..KccCCCCCCccK..", "..KcCCKKKKCCcK..",
  "..KcCKeeeeKCcK..", "..KcCKeEEeKCcK..", "..KcCKeeeeKCcK..", "..KcCCKKKKCCcK..", "..KccCCCCCCccK..",
  "...KccccccccK...", "....KKmmmmKK....", "...KmmmmmmmmK...", "..KmmmmmmmmmmK..", "..KKKKKKKKKKKK.."].map(s => s || "................"),
  { K:"#120e1e", c:"#3f3268", C:"#7a68b8", e:"#ff3fa4", E:"#ffd0ea", m:"#26203c" });
const turretGlow = sprite(["", "", "....KKKKKKKK....", "...KccccccccK...", "..KccCCCCCCccK..", "..KcCCKKKKCCcK..",
  "..KcCKEEEEKCcK..", "..KcCKEEEEKCcK..", "..KcCKEEEEKCcK..", "..KcCCKKKKCCcK..", "..KccCCCCCCccK..",
  "...KccccccccK...", "....KKmmmmKK....", "...KmmmmmmmmK...", "..KmmmmmmmmmmK..", "..KKKKKKKKKKKK.."].map(s => s || "................"),
  { K:"#120e1e", c:"#7a3a6a", C:"#ff3fa4", E:"#ffffff", m:"#26203c" });
const SHARD = sprite(["", ".......KK.......", "......KyyK......", "......KyYK......", ".....KyyYYK.....", "KKKKKyyyYYYKKKKK",
  "KyyyyyyyYYYYYYYK", ".KyyyyyyYYYYYYK.", "..KyyyyyYYYYYK..", "...KyyyyYYYYK...", "...KyyyKKYYYK...", "..KyyyK..KYYYK..",
  "..KyyK....KYYK..", ".KyK........KYK.", ".KK..........KK.", ""].map(s => s || "................"),
  { K:"#5a3a00", y:"#ffd84a", Y:"#fff6b0" });
const KEY = sprite(["", "", "", "....KKKK........", "...KyyyyK.......", "..KyyKKyyK......", "..KyK..KyKKKKKKK",
  "..KyK..KyyyyyyyK", "..KyyKKyyKKyKyKK", "...KyyyyK..K.K..", "....KKKK........", ""].map(s => s || "................"),
  { K:"#5a3a00", y:"#ffd84a" });
const HEART = sprite(["", "", "", "...KKK...KKK....", "..KrrrK.KrrrK...", ".KrwrrrKrrrrrK..", ".KrwrrrrrrrrrK..",
  ".KrrrrrrrrrrrK..", "..KrrrrrrrrrK...", "...KrrrrrrrK....", "....KrrrrrK.....", ".....KrrrK......", "......KrK.......",
  ".......K........", ""].map(s => s || "................"), { K:"#3a0a1a", r:"#ff4a6a", w:"#ffffff" });
const HEART_EMPTY = sprite(["", "", "", "...KKK...KKK....", "..KdddK.KdddK...", ".KdddddKdddddK..", ".KdddddddddddK..",
  ".KdddddddddddK..", "..KdddddddddK...", "...KdddddddK....", "....KdddddK.....", ".....KdddK......", "......KdK.......",
  ".......K........", ""].map(s => s || "................"), { K:"#3a0a1a", d:"#3a2240" });

/* ---------------------------------------------------------------- tiles */
const tileCache = {};
function floorPaint(g, R, seed, decor) {
  const r = rng(seed);
  px(g, 0, 0, R.floor, 16, 16);
  for (let i = 0; i < 9; i++) px(g, (r() * 16) | 0, (r() * 16) | 0, R.speck);
  if (decor) {
    for (let i = 0; i < 3; i++) {
      const x = 2 + ((r() * 11) | 0), y = 3 + ((r() * 10) | 0);
      if (R === REGIONS.meadow) { px(g, x, y + 1, R.wallL); px(g, x, y, r() < .5 ? R.accent : "#ff9ad5"); }
      else { px(g, x, y, R.wallL); px(g, x + 1, y, R.speck); }
    }
  }
}
function paintTile(region, ch, frame, variant) {
  const R = REGIONS[region];
  return mk(16, 16, g => {
    const seed = variant * 97 + 13;
    if (ch === "#") {
      px(g, 0, 0, R.wallM, 16, 16);
      for (let y = 0; y < 16; y += 8) {
        px(g, 0, y, R.wallD, 16, 1);
        const off = (y / 8) % 2 ? 4 : 12;
        px(g, off, y, R.wallD, 1, 8);
        px(g, (off + 8) % 16, y, R.wallD, 1, 8);
        px(g, 1, y + 1, R.wallL, 15, 1);
      }
      const r = rng(seed); for (let i = 0; i < 4; i++) px(g, (r() * 16) | 0, 2 + ((r() * 14) | 0), R.wallD);
      return;
    }
    if (ch === "T") {
      floorPaint(g, R, seed, false);
      if (region === "meadow") {
        px(g, 6, 11, "#5b3a1e", 4, 4); px(g, 6, 11, "#3a2410", 1, 4);
        g.fillStyle = R.wallD; g.beginPath(); g.arc(8, 7, 7, 0, 7); g.fill();
        g.fillStyle = R.wallM; g.beginPath(); g.arc(8, 6.5, 6, 0, 7); g.fill();
        px(g, 4, 3, R.wallL, 3, 2); px(g, 9, 5, R.wallL, 2, 2); px(g, 5, 8, R.wallL, 2, 1);
      } else if (region === "frost") {
        px(g, 7, 13, "#3a2410", 2, 3);
        for (let i = 0; i < 12; i++) { const w = 2 + Math.floor(i * 0.9); px(g, 8 - w / 2 - .5 | 0, 1 + i, R.wallD, w + 1, 1); }
        for (let i = 1; i < 11; i++) { const w = Math.floor(i * 0.9); px(g, 8 - w / 2 | 0, 2 + i, R.wallM, w, 1); }
        px(g, 7, 2, "#fff", 2, 1); px(g, 5, 6, "#fff", 3, 1); px(g, 4, 10, "#fff", 4, 1); px(g, 9, 9, R.wallL, 2, 1);
      } else {
        px(g, 3, 1, R.wallD, 10, 15); px(g, 4, 2, R.wallM, 8, 13); px(g, 5, 2, R.wallL, 1, 13);
        px(g, 2, 0, R.wallD, 12, 3); px(g, 2, 13, R.wallD, 12, 3); px(g, 3, 1, R.wallL, 10, 1);
      }
      return;
    }
    if (ch === "~") {
      const [d, m, l] = R.water;
      px(g, 0, 0, d, 16, 16);
      for (let y = 2; y < 16; y += 5) for (let x = 0; x < 16; x += 8) {
        const o = (x + y * 3 + frame * 3) % 16;
        px(g, (o + x) % 16, y, m, 4, 1); px(g, (o + x + 1) % 16, y - 1, l, 2, 1);
      }
      return;
    }
    if (ch === "=") {
      px(g, 0, 0, "#9fdcff", 16, 16); px(g, 0, 15, "#6ab0e0", 16, 1); px(g, 15, 0, "#6ab0e0", 1, 16);
      for (let i = 0; i < 5; i++) px(g, 3 + i + (variant % 3) * 2, 9 - i, "#e8faff");
      px(g, 11, 3, "#e8faff", 2, 1);
      return;
    }
    floorPaint(g, R, seed, ch === ",");
    if (ch === "^") {
      for (const [bx, by] of [[1, 2], [9, 2], [1, 10], [9, 10]]) {
        for (let i = 0; i < 4; i++) px(g, bx + 3 - i, by + i, HAZARD[2], 1 + i * 2, 1);
        for (let i = 0; i < 3; i++) px(g, bx + 3 - i, by + i, HAZARD[0], 1 + i, 1);
        px(g, bx + 3, by, frame ? "#fff" : HAZARD[1]);
      }
    } else if (ch === "c") {
      px(g, 2, 13, CRYSTAL[2], 12, 2);

/* ------------------------------------------------------------------ draw */
function snapshot() { return mk(PW, PH, g => drawRoom(g, false)); }
function drawRoom(g, live = true) {

  for (const s of shots) { px(g, Math.round(s.x), Math.round(s.y), "#ffe066", 4, 4); px(g, Math.round(s.x) + 1, Math.round(s.y) + 1, "#fff", 2, 2); }

}
function drawHero(g) {

const slimeCache = {};

function text(s, x, y, color = "#e8e4ff", align = "left") {

function drawHUD() {

function drawTitle() {

  px(ctx, bx + 4, by + 24, "#4b3fd1", 72, 98); px(ctx, bx + 6, by + 26, "#120f26", 68, 94);
  px(ctx, bx + 34, by + 8, "#120f26", 12, 18); px(ctx, bx + 8, by + 30, "#2a2450", 3, 70);

function draw() {

/* ------------------------------------------------------------------ loop */

(document.fonts?.load(FONT) || Promise.resolve()).catch(() => {}).finally(() => { Audio.play("title"); requestAnimationFrame(loop); });
